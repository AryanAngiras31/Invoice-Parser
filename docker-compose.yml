version: "3.8"
services:
  invoice-api:
    build: .
    restart: unless-stopped  
    ports:
      - "8002:8002"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - FLAGS_enable_pir_api=0
      - FLAGS_use_mkldnn=0
    deploy:
      resources:
        limits:
          memory: 4G  
    volumes:
      - paddle_model_cache:/home/appuser/.paddlex/official_models
      - ./logs:/app/logs 
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8002/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s 
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8002 --loop uvloop --http httptools --log-level info 2>&1 | tee -a /app/logs/uvicorn.log"

volumes:
  paddle_model_cache: