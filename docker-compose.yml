version: "3.8"
services:
  invoice-api:
    build: .
    ports:
      - "8002:8002"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      # For paddle bug fixes
      - FLAGS_enable_pir_api=0
      - FLAGS_use_mkldnn=0
    volumes:
      - .:/app
      - paddle_model_cache:/root/.paddlex/official_models
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8002/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  paddle_model_cache:
